name: AbilityCam
options:
  bundleIdPrefix: com.ability
  deploymentTarget:
    iOS: "17.0"
targets:
  AbilityCam:
    type: application
    platform: iOS
    sources:
      - path: AbilityCam
        excludes:
          - "Resources/**"
      - path: AbilityCam/Resources
        buildPhase: resources
        optional: true
        excludes:
          - "*.mlmodelc/**"
      # 話者の区別のモデル（v1.10.2〜）は AbilityCam/Models/wespeaker_3s.mlpackage（このリポジトリで変換したもの。CC BY 4.0、README の「ライセンス」）。
      # AbilityCam の中なので、Xcode がビルドのときに wespeaker_3s.mlmodelc にする
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ability.cam
        DEVELOPMENT_TEAM: ${TEAM_ID}
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"   # iPhone（撮る側）と iPad（見る側）。Apple シリコンの Mac では iPad 用アプリとして動く
        SWIFT_VERSION: "5.0"
        COREML_CODEGEN_LANGUAGE: None   # モデルの Swift クラスは使わない（MLModel で読む）
        ENABLE_USER_SCRIPT_SANDBOXING: NO   # CocoaPods のスクリプトを動かすため
    info:
      path: AbilityCam/Info.plist
      properties:
        CFBundleDisplayName: Ability Cam
        NSCameraUsageDescription: 介助中のやり取りで、表情の変化をその場で解析するために使います。映像は保存せず、外にも送りません。
        NSMicrophoneUsageDescription: 声の大きさと高さを、その場で解析するために使います。音声は保存せず、外にも送りません。
        NSLocalNetworkUsageDescription: 家の中の iPad や Mac に、顔の絵といつもとの違いを端末どうし直接送るために使います。映像・音声は送らず、インターネットは使いません。
        NSBonjourServices: [_abilitycam._tcp, _abilitycam._udp]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
